name: AutoDiscovery CI

on:
  push:
    branches: [ main, feature/autodiscovery-v0.1, feature/autodiscovery-debugui-h5gg ]
  pull_request:

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Compile Objective-C/Objective-C++ debug build
        run: make check DEBUG_UI=1
      - name: Build iOS arm64 debug dylib
        run: make dylib DEBUG_UI=1
      - name: Inspect Mach-O
        run: |
          file build/yunooos-debug.dylib
          xcrun vtool -show-build build/yunooos-debug.dylib || true
          shasum -a 256 build/yunooos-debug.dylib
      - name: Upload debug dylib
        uses: actions/upload-artifact@v4
        with:
          name: yunooos-autodiscovery-debugui-h5gg
          path: build/yunooos-debug.dylib
          if-no-files-found: error
