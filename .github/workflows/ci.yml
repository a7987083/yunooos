name: AutoDiscovery CI

on:
  push:
    branches: [ main, feature/autodiscovery-v0.1 ]
  pull_request:

jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Compile Objective-C/Objective-C++ core
        run: make check
